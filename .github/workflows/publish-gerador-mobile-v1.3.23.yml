name: Publicar Gerador Mobile v1.3.23

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-gerador-mobile-v1.3.23.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar APK
        run: curl --fail --location --retry 5 --retry-delay 3 --max-time 300 -o Omnes-Tech-Gerador-de-Licencas-v1.3.23.apk https://omnes-tech-license-server.onrender.com/api/v1/mobile-update/download

      - name: Validar APK
        run: |
          set -e
          test -f Omnes-Tech-Gerador-de-Licencas-v1.3.23.apk
          test "$(stat -c%s Omnes-Tech-Gerador-de-Licencas-v1.3.23.apk)" -gt 40000000
          SHA="$(sha256sum Omnes-Tech-Gerador-de-Licencas-v1.3.23.apk | awk '{print $1}')"
          test "$SHA" = "674dc41592ffb8bf1dc6716cfb7c886ec76d13622141a2a1bfd866bdb4eb02f0"
          echo "$SHA  Omnes-Tech-Gerador-de-Licencas-v1.3.23.apk" > SHA256SUMS-Gerador-Mobile-v1.3.23.txt

      - name: Publicar Release publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="gerador-mobile-v1.3.23"
          gh release delete "$TAG" -R LucAlcantara/Gestao-para-Fotografos-Downloads --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" Omnes-Tech-Gerador-de-Licencas-v1.3.23.apk SHA256SUMS-Gerador-Mobile-v1.3.23.txt -R LucAlcantara/Gestao-para-Fotografos-Downloads --target "$GITHUB_SHA" --title "Omnes Tech Gerador de Licencas Mobile v1.3.23" --notes "APK oficial assinado. Codigo-fonte do aplicativo permanece privado."
